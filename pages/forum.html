    <div class="lms-main">

      <div class="lms-content-wrapper">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px;">
          <div>
            <h1 style="font-size: 20px; font-weight: 700; color: #0F172A;">Forum de discussion</h1>
            <p style="font-size: 12.5px; color: #64748B; margin-top: 2px;">Échanges pédagogiques avec enseignants et étudiants</p>
          </div>
          <button id="new-topic-button" class="btn btn-primary btn-sm">+ Poser une question</button>
        </div>

        <div id="forum-topics" style="display:flex;flex-direction:column;gap:16px;" aria-live="polite"></div>
      </div>
    </div>

  <script src="../js/api.js"></script>
  <script>
    const forumSearch = document.querySelector('.lms-search-box input');
    let forumTopics = [];

    function renderTopics() {
      const container = document.getElementById('forum-topics');
      const query = (forumSearch?.value || '').trim().toLowerCase();
      const visibleTopics = forumTopics.filter(topic => `${topic.title} ${topic.content} ${topic.course_title} ${topic.firstname} ${topic.lastname}`.toLowerCase().includes(query));
      if (!visibleTopics.length) {
        container.innerHTML = '<div class="card" style="padding:20px;color:#64748B;">Aucun sujet ne correspond à la recherche.</div>';
        return;
      }
      container.innerHTML = visibleTopics.map(topic => {
        const date = new Date(String(topic.created_at).replace(' ', 'T'));
        const age = Number.isNaN(date.getTime()) ? '' : new Intl.DateTimeFormat('fr-FR', { dateStyle: 'medium' }).format(date);
        return `<article class="card" style="margin:0;"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:8px;"><span class="badge badge-active">${topic.course_title || 'Cours'}</span><span style="font-size:11px;color:${Number(topic.is_resolved) ? '#10B981' : '#D97706'};font-weight:600;">${Number(topic.is_resolved) ? '✓ Résolu' : 'En discussion'}</span></div><h3 style="font-size:14.5px;font-weight:600;color:#0F172A;margin-bottom:6px;">${topic.title}</h3><p style="font-size:12.5px;color:#64748B;line-height:1.5;margin-bottom:12px;">${topic.content}</p><div style="display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:12px;color:#64748B;border-top:1px solid #F1F5F9;padding-top:10px;"><span>Par ${topic.firstname || ''} ${topic.lastname || ''}${age ? ` · ${age}` : ''}</span><span>${Number(topic.replies_count || 0)} réponse(s)</span></div></article>`;
      }).join('');
    }

    async function loadTopics() {
      const container = document.getElementById('forum-topics');
      container.innerHTML = '<div class="card" style="padding:20px;color:#64748B;">Chargement du forum…</div>';
      try {
        const response = await API.getForumTopics();
        forumTopics = response.topics || [];
        renderTopics();
      } catch (error) {
        container.innerHTML = `<div class="card" style="padding:20px;color:#B91C1C;">Impossible de charger les sujets : ${error.message}</div>`;
      }
    }

    document.getElementById('new-topic-button').addEventListener('click', async () => {
      const title = prompt('Titre de votre question :');
      if (!title) return;
      const content = prompt('Décrivez votre question :');
      if (!content) return;
      try {
        await API.createForumTopic(1, title.trim(), content.trim());
        await loadTopics();
      } catch (error) {
        alert(error.message || 'Impossible de publier ce sujet.');
      }
    });
    forumSearch?.addEventListener('input', renderTopics);
    loadTopics();
  </script>
