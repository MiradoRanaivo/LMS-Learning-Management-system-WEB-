    <div class="lms-main">
      <header class="lms-header">
        <div class="lms-search-box">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
          <input type="text" placeholder="Rechercher...">
        </div>
      </header>

      <div class="lms-content-wrapper">
        <div style="margin-bottom: 24px;">
          <h1 style="font-size: 20px; font-weight: 700; color: #0F172A;">Ressources</h1>
          <p style="font-size: 12.5px; color: #64748B; margin-top: 2px;">Documents, guides et supports de cours</p>
          <button type="button" id="resource-add" class="btn btn-primary btn-sm" hidden style="margin-top:12px;">+ Ajouter une ressource</button>
        </div>

        <!-- Filter tabs matching Screen 8 -->
        <div class="tabs-nav">
          <button class="tab-btn active" data-type="all">Tous</button>
          <button class="tab-btn" data-type="cours">Cours</button>
          <button class="tab-btn" data-type="document">Documents</button>
          <button class="tab-btn" data-type="video">Vidéos</button>
          <button class="tab-btn" data-type="lien">Liens</button>
          <button class="tab-btn" data-type="image">Images</button>
        </div>

        <div id="resources-list" style="display: flex; flex-direction: column; gap: 12px;" aria-live="polite"></div>
      </div>

  <dialog id="resource-editor" class="card" style="width:min(600px,calc(100% - 32px));max-height:90vh;overflow:auto;border:0;border-radius:12px;padding:24px;color:#0F172A;">
    <form id="resource-form">
      <h2 id="resource-form-title" style="font-size:18px;margin:0 0 16px;">Ajouter une ressource</h2>
      <label style="display:block;font-size:12px;margin:10px 0;">Titre<input name="title" required maxlength="200" class="form-input" style="display:block;width:100%;margin-top:5px;"></label>
      <label style="display:block;font-size:12px;margin:10px 0;">Description<textarea name="description" rows="3" class="form-input" style="display:block;width:100%;margin-top:5px;resize:vertical;"></textarea></label>
      <label style="display:block;font-size:12px;margin:10px 0;">Cours<select name="course_id" class="form-input" style="display:block;width:100%;margin-top:5px;"><option value="">Ressource générale</option></select></label>
      <label style="display:block;font-size:12px;margin:10px 0;">Type<select name="type" required class="form-input" style="display:block;width:100%;margin-top:5px;"><option value="document">Document</option><option value="cours">Support de cours</option><option value="image">Image</option><option value="lien">Lien externe</option><option value="video">Vidéo externe</option></select></label>
      <label id="resource-file-label" style="display:block;font-size:12px;margin:10px 0;">Fichier (PDF, présentation, document ou image)<input name="file" type="file" accept=".pdf,.ppt,.pptx,.doc,.docx,.xls,.xlsx,.jpg,.jpeg,.png,.gif,.webp" style="display:block;width:100%;margin-top:5px;"></label>
      <label id="resource-url-label" hidden style="display:block;font-size:12px;margin:10px 0;">URL externe<input name="external_url" type="url" maxlength="2048" placeholder="https://…" class="form-input" style="display:block;width:100%;margin-top:5px;"></label>
      <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:16px;"><button type="button" class="btn btn-secondary btn-sm" id="resource-cancel">Annuler</button><button type="submit" class="btn btn-primary btn-sm">Enregistrer</button></div>
    </form>
  </dialog>

  <script src="../js/api.js"></script>
  <script>
    const resourceImages = [
      'https://images.unsplash.com/photo-1516321318423-f06f85e504b3?auto=format&fit=crop&w=160&h=120&q=85',
      'https://images.unsplash.com/photo-1515879218367-8466d910aaa4?auto=format&fit=crop&w=160&h=120&q=85',
      'https://images.unsplash.com/photo-1544383835-bda2bc66a55d?auto=format&fit=crop&w=160&h=120&q=85'
    ];
    let resourceType = 'all';
    let canManageResources = false;
    const resourceDialog = document.getElementById('resource-editor');
    const resourceForm = document.getElementById('resource-form');

    function escapeHTML(value) {
      return String(value ?? '').replace(/[&<>"']/g, (char) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[char]);
    }

    function safeResourceUrl(value) {
      const url = String(value || '');
      if (/^https?:\/\//i.test(url)) return url;
      return /^\.\.\/api\/resources\/download\.php\?id=\d+$/.test(url) ? url : '';
    }

    function updateResourceFormType() {
      const external = ['lien', 'video'].includes(resourceForm.elements.type.value);
      document.getElementById('resource-file-label').hidden = external;
      document.getElementById('resource-url-label').hidden = !external;
      document.getElementById('resource-file-label').style.display = external ? 'none' : 'block';
      document.getElementById('resource-url-label').style.display = external ? 'block' : 'none';
      resourceForm.elements.file.required = !external && !resourceForm.dataset.id;
      resourceForm.elements.external_url.required = external;
    }

    async function loadResources() {
      const container = document.getElementById('resources-list');
      container.innerHTML = '<div class="card" style="padding:20px;color:#64748B;">Chargement des ressources…</div>';
      try {
        const response = await API.getResources(resourceType);
        const resources = response.resources || [];
        if (!resources.length) {
          container.innerHTML = '<div class="card" style="padding:20px;color:#64748B;">Aucune ressource disponible dans cette catégorie.</div>';
          return;
        }
        container.innerHTML = resources.map((resource, index) => {
          const url = safeResourceUrl(resource.access_url);
          const external = /^https?:\/\//i.test(url);
          const published = resource.published_date ? new Intl.DateTimeFormat('fr-FR', { dateStyle: 'medium' }).format(new Date(`${resource.published_date}T00:00:00`)) : '';
          const action = resource.type === 'video' || resource.type === 'lien' ? 'Ouvrir' : 'Télécharger';
          const controls = canManageResources ? `<div style="display:flex;gap:6px;"><button type="button" class="btn btn-secondary btn-sm" data-resource-action="edit" data-resource-id="${Number(resource.id)}">Modifier</button><button type="button" class="btn btn-secondary btn-sm" data-resource-action="delete" data-resource-id="${Number(resource.id)}">Supprimer</button></div>` : '';
          const actionLink = url ? `<a class="btn btn-secondary btn-sm" href="${escapeHTML(url)}" ${external ? 'target="_blank" rel="noopener noreferrer"' : 'download'}>${action}</a>` : '<span style="font-size:11px;color:#B91C1C;">Fichier indisponible</span>';
          return `<article class="card" style="display:flex;justify-content:space-between;align-items:center;gap:14px;padding:16px 20px;"><div style="display:flex;align-items:center;gap:14px;min-width:0;"><img src="${resourceImages[index % resourceImages.length]}" alt="" loading="lazy" style="width:64px;height:52px;border-radius:9px;object-fit:cover;flex-shrink:0;"><div style="min-width:0;"><h3 style="font-size:13.5px;font-weight:600;color:#0F172A;">${escapeHTML(resource.title)}</h3><p style="font-size:11.5px;color:#64748B;">${escapeHTML(resource.course_title || 'Ressource générale')} · ${escapeHTML(resource.file_format || resource.type)} · ${escapeHTML(resource.file_size || '')} ${published ? `· ${escapeHTML(published)}` : ''}</p>${resource.description ? `<p style="font-size:11.5px;color:#64748B;margin-top:4px;">${escapeHTML(resource.description)}</p>` : ''}</div></div><div style="display:flex;align-items:center;gap:8px;flex-shrink:0;">${actionLink}${controls}</div></article>`;
        }).join('');
      } catch (error) {
        container.innerHTML = `<div class="card" style="padding:20px;color:#B91C1C;">Impossible de charger les ressources : ${error.message}</div>`;
      }
    }

    document.querySelectorAll('.tabs-nav .tab-btn').forEach((button) => button.addEventListener('click', () => {
      document.querySelectorAll('.tabs-nav .tab-btn').forEach((tab) => tab.classList.remove('active'));
      button.classList.add('active');
      resourceType = button.dataset.type || 'all';
      loadResources();
    }));

    document.getElementById('resource-add').addEventListener('click', () => {
      resourceForm.reset(); resourceForm.dataset.id = ''; document.getElementById('resource-form-title').textContent = 'Ajouter une ressource'; updateResourceFormType(); resourceDialog.showModal();
    });
    resourceForm.elements.type.addEventListener('change', updateResourceFormType);
    document.getElementById('resource-cancel').addEventListener('click', () => resourceDialog.close());
    resourceForm.addEventListener('submit', async (event) => {
      event.preventDefault();
      const data = new FormData(resourceForm);
      data.set('action', resourceForm.dataset.id ? 'update' : 'create');
      if (resourceForm.dataset.id) data.set('id', resourceForm.dataset.id);
      try { await API.saveResource(data); resourceDialog.close(); await loadResources(); }
      catch (error) { alert(error.message || 'Enregistrement impossible.'); }
    });
    document.getElementById('resources-list').addEventListener('click', async (event) => {
      const button = event.target.closest('[data-resource-action]');
      if (!button) return;
      const resourceId = Number(button.dataset.resourceId);
      try {
        if (button.dataset.resourceAction === 'delete') {
          if (confirm('Supprimer cette ressource ?')) { await API.deleteResource(resourceId); await loadResources(); }
          return;
        }
        const resource = (await API.getResources('all')).resources.find((item) => Number(item.id) === resourceId);
        if (!resource) return;
        resourceForm.reset(); resourceForm.dataset.id = String(resource.id);
        resourceForm.elements.title.value = resource.title || '';
        resourceForm.elements.description.value = resource.description || '';
        resourceForm.elements.course_id.value = resource.course_id || '';
        resourceForm.elements.type.value = resource.type;
        resourceForm.elements.external_url.value = /^https?:\/\//i.test(resource.access_url || '') ? resource.access_url : '';
        document.getElementById('resource-form-title').textContent = 'Modifier la ressource';
        updateResourceFormType(); resourceDialog.showModal();
      } catch (error) { alert(error.message || 'Opération impossible.'); }
    });

    async function initializeResources() {
      try {
        const me = await API.getMe();
        canManageResources = ['teacher', 'admin'].includes(me?.user?.role);
        const addButton = document.getElementById('resource-add');
        addButton.hidden = !canManageResources;
        addButton.style.display = canManageResources ? 'inline-flex' : 'none';
        if (canManageResources) {
          const courseResponse = await API.getCourses('all');
          const select = resourceForm.elements.course_id;
          (courseResponse.courses || []).forEach((course) => {
            const option = document.createElement('option'); option.value = course.id; option.textContent = `${course.code} · ${course.title}`; select.appendChild(option);
          });
        }
      } catch (error) { console.error('Profil indisponible:', error); }
      await loadResources();
    }
    initializeResources();
  </script>
</body>
