            <div style="display: flex; justify-content: flex-end; margin-top: 20px;">

                Enregistrer

  <script src="../js/api.js"></script>
  <script>
    async function loadProfile() {
      try {
        const response = await API.getMe();
        if (!response?.authenticated || !response.user) return;

        const user = response.user;
        const fullName = `${user.firstname || ''} ${user.lastname || ''}`.trim();
        const initials = `${user.firstname?.[0] || ''}${user.lastname?.[0] || ''}`.toUpperCase();
        const avatar = document.getElementById('profile-avatar');
        const avatarImage = avatar?.querySelector('img');
        const avatarInitials = document.getElementById('profile-avatar-initials');

        if (avatarImage && user.avatar_url) {
          avatarImage.src = user.avatar_url;
          avatarImage.alt = `Photo de profil de ${fullName}`;
          avatarImage.hidden = false;
          if (avatarInitials) avatarInitials.hidden = true;
        } else {
          if (avatarImage) avatarImage.hidden = true;
          if (avatarInitials) {
            avatarInitials.textContent = initials || 'U';
            avatarInitials.hidden = false;
          }
        }

        const heading = document.querySelector('.lms-content-wrapper h1');
        const info = document.querySelector('#profile-form');
        if (heading) heading.textContent = fullName || user.email;
        const bannerInfo = document.querySelector('.profile-banner-info');
        if (bannerInfo) {
          bannerInfo.querySelector('[data-profile-role]').textContent = user.role === 'teacher' ? 'Enseignant' : user.role === 'admin' ? 'Administrateur' : 'Étudiant';
          bannerInfo.querySelector('[data-profile-email]').textContent = user.email || '';
        }
        if (info) {
          document.getElementById('profile-name').value = fullName;
          document.getElementById('profile-email').value = user.email || '';
          document.getElementById('profile-phone').value = user.phone || '';
        }
      } catch (error) {
        console.warn('Impossible de charger le profil depuis le serveur:', error);
      }
    }

    loadProfile();

    document.getElementById('profile-form').addEventListener('submit', async (event) => {
      event.preventDefault();
      const fullName = document.getElementById('profile-name').value.trim().split(/\s+/);
      const firstname = fullName.shift() || '';
      const lastname = fullName.join(' ');
      const phone = document.getElementById('profile-phone').value.trim();
      const bio = document.getElementById('profile-bio')?.value.trim() || '';
      const button = event.currentTarget.querySelector('button[type="submit"]');
      button.disabled = true;
      button.textContent = 'Enregistrement…';
      try {
        const profile = { firstname, lastname, phone };
        if (document.getElementById('profile-bio')) profile.bio = bio;
        const result = await API.updateProfile(profile);
        const heading = document.querySelector('.lms-content-wrapper h1');
        if (heading) heading.textContent = `${firstname} ${lastname}`.trim();
        const bannerRole = document.querySelector('[data-profile-role]');
        if (bannerRole) bannerRole.textContent = `${bannerRole.textContent.split('•')[0].trim()} • Profil mis à jour`;
        alert(result.message || 'Profil enregistré.');
      } catch (error) {
        alert(error.message || 'Impossible d’enregistrer le profil.');
      } finally {
        button.disabled = false;
        button.textContent = 'Enregistrer';
      }
    });
  </script>
