<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connexion - LMS Web</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/responsive.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    html { background: #F8FAFC; }
    body::before { content: ""; position: absolute; top: 0; left: 0; width: 100%; height: 4px; background: #047857; }
    body {
      position: relative;
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      background: #F8FAFC;
      padding: 72px 20px 24px;
    }
    .login-container {
      width: 100%;
      max-width: 460px;
      background: #FFFFFF;
      border: 1px solid #E2E8F0;
      border-radius: 12px;
      padding: 32px;
      box-shadow: 0 1px 3px rgba(15, 23, 42, 0.05);
    }
    .login-back { position: absolute; top: 20px; left: max(20px, calc((100% - 460px) / 2)); color: #064E3B; font-size: 14px; font-weight: 600; text-decoration: none; }
    .login-back:hover { color: #047857; text-decoration: underline; }
    .login-brand { justify-content: flex-start !important; }
    .login-container h1 { font-size: 28px !important; letter-spacing: -.025em; }
    .login-container .form-label { font-size: 14px; }
    .login-container .form-input { min-height: 44px; font-size: 15px; border-radius: 8px; }
    .login-password-wrap { position: relative; }
    .login-password-wrap .form-input { padding-right: 48px; }
    #toggle-password { position: absolute; top: 2px; right: 2px; width: 40px; height: 40px; border: 0; border-radius: 7px; color: #64748B; background: transparent; cursor: pointer; }
    #toggle-password:hover { color: #047857; background: #ECFDF5; }
    #login-submit { min-height: 46px; font-size: 15px; }
    #error-message { font-size: 14px !important; }
    .login-demo-label { margin-top: 20px; color: #64748B; font-size: 13px; }
    @media (max-width: 520px) {
      body { align-items: flex-start; padding: 66px 12px 16px; }
      .login-container { padding: 24px 20px; }
      .login-container h1 { font-size: 25px !important; }
      .login-back { left: 12px; top: 12px; }
    }
  </style>
</head>
<body>

  <a href="../index.php" class="login-back">← Retour à l’accueil LMS</a>

  <main class="login-container">
    <div class="login-brand" style="display: flex; align-items: center; justify-content: center; gap: 12px; margin-bottom: 24px;">
      <div class="lms-logo-icon" style="width: 40px; height: 40px; font-size: 18px;">
        LMS
      </div>
      <div>
        <div class="lms-brand-title" style="font-size: 18px;">LMS Web</div>
        <div class="lms-brand-subtitle">E-LEARNING UNIVERSITAIRE</div>
      </div>
    </div>

    <div style="text-align: center; margin-bottom: 24px;">
      <h1 style="font-size: 16px; font-weight: 700; color: #0F172A;">Bon retour parmi nous</h1>
      <p style="font-size: 14px; color: #64748B; margin-top: 6px;">Connectez-vous pour retrouver votre espace pédagogique.</p>
    </div>

    <div id="error-message" role="alert" aria-live="assertive" style="display: none; padding: 10px; border-radius: 8px; background-color: #FEF2F2; color: #DC2626; font-size: 12px; margin-bottom: 16px;"></div>

    <form id="login-form">
      <div class="form-group">
        <label class="form-label" for="email">Adresse email universitaire</label>
        <input class="form-input" type="email" id="email" autocomplete="username" required placeholder="nom.prenom@exemple.com">
      </div>

      <div class="form-group">
        <div style="display: flex; justify-content: space-between; align-items: center;">
          <label class="form-label" for="password">Mot de passe</label>
        </div>
        <div class="login-password-wrap">
          <input class="form-input" type="password" id="password" autocomplete="current-password" required>
          <button type="button" id="toggle-password" aria-label="Afficher le mot de passe" aria-pressed="false"><svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg></button>
        </div>
      </div>

      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; font-size: 12px; color: #64748B;">
        <label style="display: flex; align-items: center; gap: 6px; cursor: pointer;">
          <input type="checkbox" checked style="accent-color: #047857;"> Se souvenir de moi
        </label>
      </div>

      <button type="submit" id="login-submit" class="btn btn-primary" style="width: 100%; padding: 10px;">
        Se connecter
      </button>
    </form>

    <div style="margin-top: 24px; padding-top: 20px; border-top: 1px solid #E2E8F0; text-align: center;">
      <p style="font-size: 13px; color: #64748B; margin-bottom: 12px;">Comptes de démonstration disponibles</p>
      <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; font-size: 11px;">
        <button type="button" class="btn btn-secondary btn-sm" onclick="setAccount('andry.rakoto@exemple.com')">Étudiant</button>
        <button type="button" class="btn btn-secondary btn-sm" onclick="setAccount('tahina.ramanantsoa@exemple.com')">Enseignant</button>
        <button type="button" class="btn btn-secondary btn-sm" onclick="setAccount('tiana.rasoanaivo@exemple.com')">Admin</button>
      </div>
    </div>
    <p class="login-demo-label">Comptes de démonstration de la base initiale</p>
  </main>

  <script src="../js/api.js"></script>
  <script>
    function setAccount(email) {
      document.getElementById('email').value = email;
      document.getElementById('password').focus();
    }

    const passwordInput = document.getElementById('password');
    const togglePassword = document.getElementById('toggle-password');
    togglePassword.addEventListener('click', () => {
      const visible = passwordInput.type === 'password';
      passwordInput.type = visible ? 'text' : 'password';
      togglePassword.setAttribute('aria-label', visible ? 'Masquer le mot de passe' : 'Afficher le mot de passe');
      togglePassword.setAttribute('aria-pressed', String(visible));
    });

    const requestedEmail = new URLSearchParams(window.location.search).get('email');
    if (requestedEmail) {
      document.getElementById('email').value = requestedEmail;
    }

    const addAccountRequested = new URLSearchParams(window.location.search).get('add_account') === '1';
    if (addAccountRequested) {
      document.getElementById('email').value = '';
      document.getElementById('password').value = '';
      document.getElementById('email').focus();
    }

    async function redirectIfAuthenticated() {
      if (addAccountRequested) return;
      try {
        const res = await API.getMe();
        if (res && res.authenticated && res.user) {
          const role = res.user.role;
          if (role === 'teacher') {
            window.location.href = 'dashboard-teacher.html';
            return;
          }
          if (role === 'admin') {
            window.location.href = 'dashboard-admin.html';
            return;
          }
          window.location.href = 'dashboard-student.html';
        }
      } catch (err) {
        // Non authentifié : on reste sur la page de connexion.
      }
    }

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const errorBox = document.getElementById('error-message');
      const submitButton = document.getElementById('login-submit');

      errorBox.style.display = 'none';
      submitButton.disabled = true;
      submitButton.textContent = 'Connexion…';

      try {
        const res = await API.login(email, password);
        if (res.success && res.user) {
          const role = res.user.role;
          if (role === 'teacher') {
            window.location.href = 'dashboard-teacher.html';
          } else if (role === 'admin') {
            window.location.href = 'dashboard-admin.html';
          } else {
            window.location.href = 'dashboard-student.html';
          }
        }
      } catch (err) {
        errorBox.textContent = err.message || 'Identifiants incorrects.';
        errorBox.style.display = 'block';
      } finally {
        submitButton.disabled = false;
        submitButton.textContent = 'Se connecter';
      }
    });

    redirectIfAuthenticated();
  </script>
</body>
</html>
