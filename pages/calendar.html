              <div style="display:flex;align-items:center;gap:8px;"><span id="calendar-today" style="font-size:12px;color:#64748B;"></span><button id="calendar-next" type="button" class="btn btn-secondary btn-sm" aria-label="Mois suivant">›</button></div>

            </div>

            <div id="calendar-grid" style="display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;font-size:12px;"></div>
          </div>

          <!-- Événements Column -->
          <div class="card">
            <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:16px;"><h3 style="font-size:14px;font-weight:600;color:#0F172A;">Événements</h3><button type="button" id="add-event-button" class="btn btn-secondary btn-sm">+ Ajouter</button></div>
            <div id="calendar-events" style="display:flex;flex-direction:column;gap:12px;"></div>
          </div>
        </div>

  <script src="../js/api.js"></script>
  <script>
    let calendarMonth = new Date();
    let eventsByDate = {};
    const monthTitle = document.getElementById('calendar-month-title');
    const eventContainer = document.getElementById('calendar-events');

    function monthKey(date) { return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}`; }
    function renderCalendar() {
      const year = calendarMonth.getFullYear();
      const month = calendarMonth.getMonth();
      monthTitle.textContent = new Intl.DateTimeFormat('fr-FR', { month: 'long', year: 'numeric' }).format(calendarMonth);
      const today = new Date();
      document.getElementById('calendar-today').textContent = `Aujourd'hui : ${new Intl.DateTimeFormat('fr-FR', { day: 'numeric', month: 'short' }).format(today)}`;
      const firstDay = new Date(year, month, 1);
      const offset = (firstDay.getDay() + 6) % 7;
      const startDate = new Date(year, month, 1 - offset);
      const grid = document.getElementById('calendar-grid');
      const dateCells = [];
      for (let i = 0; i < 42; i++) {
        const date = new Date(startDate);
        date.setDate(startDate.getDate() + i);
        const key = `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`;
        const inMonth = date.getMonth() === month;
        const isToday = date.toDateString() === today.toDateString();
        const hasEvent = Boolean(eventsByDate[key]);
        dateCells.push(`<div class="calendar-day-cell" style="height:52px;border:1px solid ${isToday ? '#047857' : '#F1F5F9'};border-radius:8px;padding:4px;color:${!inMonth ? '#CBD5E1' : isToday ? '#047857' : '#334155'};background:${isToday ? '#ECFDF5' : '#fff'};font-weight:${isToday ? '700' : '400'};">${date.getDate()}${hasEvent ? '<span style="display:block;width:6px;height:6px;margin:5px auto 0;border-radius:50%;background:#059669;"></span>' : ''}</div>`);
      }
      grid.innerHTML = dateCells.join('');
    }

    async function loadCalendar() {
      eventContainer.innerHTML = '<p style="color:#64748B;font-size:12px;">Chargement…</p>';
      try {
        const response = await API.getCalendarEvents(monthKey(calendarMonth));
        const events = response.events || [];
        eventsByDate = events.reduce((map, event) => { map[event.event_date] = true; return map; }, {});
        renderCalendar();
        eventContainer.innerHTML = events.length ? events.map(event => `<article style="padding:12px;border:1px solid #E2E8F0;border-radius:8px;background:#F8FAFC;"><div style="font-size:12.5px;font-weight:600;color:#0F172A;">${event.title}</div><div style="font-size:11px;color:#64748B;margin-top:3px;">${event.course_title || 'Événement'} · ${new Intl.DateTimeFormat('fr-FR',{dateStyle:'medium'}).format(new Date(`${event.event_date}T00:00:00`))} · ${event.event_time}</div></article>`).join('') : '<p style="color:#64748B;font-size:12px;">Aucun événement ce mois-ci.</p>';
      } catch (error) {
        renderCalendar();
        eventContainer.innerHTML = `<p style="color:#B91C1C;font-size:12px;">Impossible de charger les événements : ${error.message}</p>`;
      }
    }

    document.getElementById('calendar-prev').addEventListener('click', () => { calendarMonth = new Date(calendarMonth.getFullYear(), calendarMonth.getMonth() - 1, 1); loadCalendar(); });
    document.getElementById('calendar-next').addEventListener('click', () => { calendarMonth = new Date(calendarMonth.getFullYear(), calendarMonth.getMonth() + 1, 1); loadCalendar(); });
    document.getElementById('add-event-button').addEventListener('click', async () => {
      const title = prompt('Titre de l’événement :');
      if (!title) return;
      const eventDate = prompt('Date (AAAA-MM-JJ) :', `${monthKey(calendarMonth)}-01`);
      if (!eventDate) return;
      try { await API.addCalendarEvent({ title: title.trim(), event_date: eventDate.trim(), event_time: '10:00', event_type: 'cours' }); await loadCalendar(); }
      catch (error) { alert(error.message || 'Impossible d’ajouter cet événement.'); }
    });
    loadCalendar();
  </script>
